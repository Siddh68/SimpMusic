name: iOS framework

# Builds the Kotlin Multiplatform `ComposeApp` XCFramework on macOS and publishes it to the
# rolling prerelease `ios-framework-latest`. The iOS app itself is built on Windows/WSL with
# xtool from iosApp/ (see scripts/ios/README.md), which downloads that release asset.
#
# composeApp/build.gradle.kts declares iosArm64 + iosSimulatorArm64 dynamic frameworks added to
# XCFramework("ComposeApp") -> :composeApp:assembleComposeApp{Release,Debug}XCFramework, output
# composeApp/build/XCFrameworks/{release,debug}/ComposeApp.xcframework. The framework must be
# dynamic: Compose resources travel inside it and xtool embeds it as a binaryTarget.
#
# Push builds pass -PiosDeviceOnly=true: the XCFramework then holds only the ios-arm64 (iPhone)
# slice, which is all the xtool device install uses (SwiftPM picks the ios-arm64 library from the
# XCFramework's Info.plist). Same asset name/layout, one link instead of two.
# The simulator slice and the simulator smoke test are manual only (workflow_dispatch inputs).

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "XCFramework build type"
        type: choice
        options:
          - debug
          - release
        default: debug
      simulator_slice:
        description: "Also build the iosSimulatorArm64 slice (forced on by run_simulator)"
        type: boolean
        default: false
      run_simulator:
        description: "Run the simulator smoke test after the build"
        type: boolean
        default: false
  push:
    branches:
      - ios
    paths-ignore:
      - '**.md'
      - 'fastlane/**'
      - 'asset/**'
      - 'changelogs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - 'scripts/ios/**'
      - '.github/workflows/verify-platforms.yml'

permissions:
  contents: write

concurrency:
  group: ios-framework-${{ github.ref }}
  cancel-in-progress: true

env:
  # push events have no inputs -> debug. The first release link of the full app ran into the
  # job timeout (two optimised links in parallel on a 7 GB runner), so release is opt-in.
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
  # 'false' only on a manual run that asked for the simulator slice or the simulator test.
  IOS_DEVICE_ONLY: ${{ (github.event_name == 'workflow_dispatch' && (inputs.simulator_slice || inputs.run_simulator)) && 'false' || 'true' }}

jobs:
  framework:
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # `ios` is not the repo's default branch (dev), so setup-gradle would default to
      # read-only and never save the Gradle User Home (dependencies + local build cache):
      # every run re-downloaded everything. Writing is safe: entries are scoped to this branch.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      # FOSS flavour. Every module reads the flag as `extra["isFullBuild"] == "true"`;
      # both a -P override and a later line in gradle.properties win over the committed
      # `isFullBuild=true` (verified on Gradle 9.8.1). We do both: the appended line keeps
      # the value right even for Gradle invocations that forget the -P flag.
      # With isFullBuild=false, BuildKonfig/Sentry never read local.properties and the
      # proprietary modules (cast, lastfm, crashlytics) are swapped for their *-empty stubs.
      # An empty local.properties is still created so nothing trips over a missing file.
      - name: Configure FOSS build (no secrets)
        run: |
          printf '\nisFullBuild=false\n' >> gradle.properties
          touch local.properties
          tail -3 gradle.properties

      - name: Toolchain info
        run: |
          sw_vers; xcodebuild -version; java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          chmod +x gradlew

      - name: Build XCFramework (${{ env.BUILD_TYPE }}, device only = ${{ env.IOS_DEVICE_ONLY }})
        run: |
          case "$BUILD_TYPE" in
            release) TASK=assembleComposeAppReleaseXCFramework; LINK=linkReleaseFramework ;;
            *)       TASK=assembleComposeAppDebugXCFramework;   LINK=linkDebugFramework ;;
          esac
          # --build-cache: task outputs (klibs of unchanged modules, KSP, resources) are reused
          # from the cached Gradle User Home, keyed by their inputs. Link tasks are not cacheable.
          ARGS="-PisFullBuild=false -PiosDeviceOnly=$IOS_DEVICE_ONLY --build-cache --stacktrace"
          if [ "$IOS_DEVICE_ONLY" = true ]; then
            # One slice -> one link; the XCFramework task depends on linkXxxFrameworkIosArm64 only.
            ./gradlew ":composeApp:$TASK" $ARGS
          else
            # Link the two slices one after the other: both links run inside the Gradle daemon
            # and together they do not fit in the runner's memory.
            ./gradlew ":composeApp:${LINK}IosArm64" $ARGS
            ./gradlew ":composeApp:${LINK}IosSimulatorArm64" $ARGS
            ./gradlew ":composeApp:$TASK" $ARGS
          fi

      - name: Inspect XCFramework
        run: |
          XCF="composeApp/build/XCFrameworks/$BUILD_TYPE/ComposeApp.xcframework"
          test -d "$XCF"
          test -f "$XCF/ios-arm64/ComposeApp.framework/ComposeApp"
          if [ "$IOS_DEVICE_ONLY" != true ]; then test -d "$XCF/ios-arm64-simulator"; fi
          plutil -p "$XCF/Info.plist" || true
          find "$XCF" -maxdepth 3 | sort
          file "$XCF"/ios-arm64/ComposeApp.framework/ComposeApp || true
          echo "--- compose resources inside the framework:"
          find "$XCF" -path '*compose-resources*' | head -20 || true
          du -sh "$XCF"

      - name: Zip (symlinks preserved)
        run: |
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent \
            "composeApp/build/XCFrameworks/$BUILD_TYPE/ComposeApp.xcframework" \
            out/ComposeApp.xcframework.zip
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ios-framework
          path: out/ComposeApp.xcframework.zip
          if-no-files-found: error

      - name: Publish rolling prerelease ios-framework-latest
        if: github.ref == 'refs/heads/ios'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=ios-framework-latest
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --title "$TAG" \
              --notes "Rolling build of ComposeApp.xcframework for the xtool iOS app."
          fi
          gh release edit "$TAG" --prerelease \
            --notes "Rolling $BUILD_TYPE build of ComposeApp.xcframework (device only: $IOS_DEVICE_ONLY) from $GITHUB_SHA (run $GITHUB_RUN_ID)."
          gh release upload "$TAG" out/ComposeApp.xcframework.zip --clobber

  simulator:
    # Smoke test only: does the framework load and Compose draw something in the simulator?
    # Manual only (run_simulator input), so a push run is a single job and never waits for a
    # second macOS runner.
    needs: framework
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_simulator }}
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ios-framework
          path: dl

      - name: Unpack into iosApp/Frameworks
        run: |
          mkdir -p iosApp/Frameworks
          ditto -x -k dl/ComposeApp.xcframework.zip iosApp/Frameworks
          find iosApp/Frameworks -maxdepth 2 | sort

      - name: Generate Xcode project (xcodegen)
        run: |
          which xcodegen || brew install xcodegen
          cd iosApp/sim && xcodegen generate

      - name: Build app for simulator
        run: |
          cd iosApp/sim
          set -o pipefail
          xcodebuild -project SimpMusicSim.xcodeproj -scheme SimpMusic -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build | tail -60
          APP=build/Build/Products/Debug-iphonesimulator/SimpMusic.app
          test -d "$APP"
          find "$APP" -maxdepth 3 | sort | head -60

      - name: Run in simulator and screenshot
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(r,x) for r,l in d.items() if "iOS" in r for x in l if x["name"].startswith("iPhone")]
          c.sort(key=lambda t:t[0])
          print(c[-1][1]["udid"])')
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" iosApp/sim/build/Build/Products/Debug-iphonesimulator/SimpMusic.app
          mkdir -p shots
          xcrun simctl launch --console-pty "$UDID" io.github.siddh68.simpmusic > shots/app-console.log 2>&1 &
          sleep 40
          xcrun simctl io "$UDID" screenshot shots/simulator.png
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "SimpMusic"' --style compact > shots/oslog.txt 2>&1 || true
          xcrun simctl spawn "$UDID" launchctl list | grep -i simpmusic > shots/still-running.txt 2>&1 || echo "app not running (crashed?)" > shots/still-running.txt
          cat shots/still-running.txt
          cp ~/Library/Logs/DiagnosticReports/SimpMusic* shots/ 2>/dev/null || true
          tail -80 shots/app-console.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshot
          path: shots/
